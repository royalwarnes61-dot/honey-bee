<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bee Life: NYC Hive</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;font-family:Arial,Helvetica,sans-serif;user-select:none}
canvas{display:block;width:100%;height:100%;background:#79c8ff}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(20,25,33,.88);border:2px solid rgba(255,255,255,.14);box-shadow:0 8px 30px rgba(0,0,0,.3);border-radius:16px;color:white}
#topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.stat{padding:8px 11px;border-radius:12px;background:rgba(15,20,28,.8);color:white;font-weight:bold;font-size:13px;border:1px solid rgba(255,255,255,.1)}
#rankBox{padding:8px 12px;background:rgba(15,20,28,.88);border-radius:12px;color:#ffd84a;font-weight:bold;border:1px solid rgba(255,216,74,.25)}
#bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:end;gap:10px;pointer-events:auto}
#controls,#actionButtons{display:flex;gap:9px}
.control{width:64px;height:64px;border:0;border-radius:18px;background:rgba(20,25,33,.9);color:white;font-size:25px;box-shadow:0 5px 15px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.08)}
.control:active,.action:active{transform:scale(.93)}
.action{min-width:95px;height:52px;border:0;border-radius:15px;color:#17120a;background:#ffd447;font-weight:900;box-shadow:0 5px 15px rgba(0,0,0,.25)}
.action.green{background:#6ee7a3}
#sideButtons{position:absolute;right:12px;top:75px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.side{width:50px;height:50px;border:0;border-radius:15px;background:rgba(20,25,33,.88);color:white;font-size:22px}
#message{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:rgba(15,20,28,.9);color:white;padding:10px 17px;border-radius:13px;font-weight:bold;opacity:0;transition:.25s;text-align:center;max-width:85%}
#menu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);pointer-events:auto}
.menuPanel{width:min(650px,94vw);max-height:88vh;overflow:auto;padding:20px}
.menuPanel h1{margin:0 0 14px;color:#ffd447}
.close{float:right;border:0;border-radius:10px;background:#ff6767;color:white;width:38px;height:38px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:12px}
.card button{width:100%;border:0;padding:10px;border-radius:10px;background:#ffd447;font-weight:bold;margin-top:8px}
.progress{height:10px;border-radius:99px;background:#303744;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;width:0%;background:#ffd447}
#touchHint{position:absolute;bottom:94px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:7px 11px;color:white;border-radius:10px;font-size:12px}
@media(max-width:600px){#topbar{top:6px;left:6px;right:6px}.stat{font-size:11px;padding:6px 8px}#rankBox{font-size:11px;padding:6px 8px}.control{width:55px;height:55px}.action{min-width:78px;height:48px;font-size:12px}#bottom{bottom:7px}#sideButtons{top:62px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="topbar"><div class="stats">
<div class="stat">🍯 <span id="honey">0</span></div>
<div class="stat">🌼 <span id="nectar">0</span></div>
<div class="stat">💧 <span id="drops">0</span></div>
<div class="stat">🐝 Hive <span id="bees">6</span></div>
</div><div id="rankBox">🐝 <span id="rank">Larva</span> Lv.<span id="level">0</span></div></div>
<div id="sideButtons">
<button class="side" onclick="openMenu('shop')">🛒</button>
<button class="side" onclick="openMenu('hive')">🏠</button>
<button class="side" onclick="openMenu('stats')">📊</button>
<button class="side" onclick="openMenu('help')">❔</button>
</div>
<div id="message"></div>
<div id="touchHint">Hold 🌼 near flowers • Hold 🍯 at honey pot • WASD / arrows to fly</div>
<div id="bottom"><div id="controls">
<button class="control" id="up">▲</button><button class="control" id="left">◀</button>
<button class="control" id="down">▼</button><button class="control" id="right">▶</button>
</div><div id="actionButtons">
<button class="action green" id="nectarBtn">🌼 Nectar</button>
<button class="action" id="honeyBtn">🍯 Shape</button>
</div></div>
<div id="menu"><div class="menuPanel panel"><button class="close" onclick="closeMenu()">X</button><div id="menuContent"></div></div></div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let W=innerWidth,H=innerHeight;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}addEventListener("resize",resize);resize();
const SAVE_KEY="beeLifeNYC_v1";
const defaultState={x:0,y:0,level:0,xp:0,nectar:0,honey:0,drops:0,bees:6,hiveSize:1,nectarCollected:0,flowersPollinated:0,honeyMade:0,distance:0,deaths:0,speed:1,gatherSpeed:1,health:100,maxHealth:100,rank:"Larva",upgrades:{wings:0,proboscis:0,armor:0,gathering:0,luck:0},hiveColor:0,hivePattern:0,achievements:[],quests:{nectar:0,pollination:0,honey:0,distance:0},hatched:false,larvaFood:0,age:0,settings:{sound:true}};
let state=JSON.parse(JSON.stringify(defaultState));try{const s=localStorage.getItem(SAVE_KEY);if(s){state=Object.assign(state,JSON.parse(s));state.upgrades=Object.assign(defaultState.upgrades,state.upgrades||{});state.quests=Object.assign(defaultState.quests,state.quests||{})}}catch(e){}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
const ranks=[{name:"Larva",xp:0},{name:"Worker Bee",xp:100},{name:"Honey Bee",xp:600},{name:"Scout Bee",xp:1800},{name:"Soldier Bee",xp:4500},{name:"Royal Guard",xp:10000},{name:"Elder Bee",xp:25000},{name:"Royal Bee",xp:60000},{name:"Queen Bee",xp:150000}];
function updateRank(){let r=ranks[0];for(const rank of ranks)if(state.xp>=rank.xp)r=rank;if(r.name!==state.rank){state.rank=r.name;showMessage("👑 You became a "+r.name+"!");spawnBurst(state.x,state.y,"#ffd447",30)}document.getElementById("rank").textContent=r.name;document.getElementById("level").textContent=state.level}
const world={width:5000,height:3200},camera={x:0,y:0},hive={x:0,y:0},flowers=[],buildings=[],enemies=[],npcs=[],particles=[],floating=[];
function rand(a,b){return Math.random()*(b-a)+a}function randInt(a,b){return Math.floor(rand(a,b+1))}
function createWorld(){
 const colors=["#ff5ca8","#fff27a","#b979ff","#ffffff","#ff8b57","#64e7ff"];
 for(let i=0;i<170;i++){let x=rand(-2300,2300),y=rand(-1400,1400);if(Math.abs(x)<250&&Math.abs(y)<220){i--;continue}flowers.push({x,y,color:colors[randInt(0,colors.length-1)],nectar:randInt(1,4),cooldown:0,size:rand(7,13)})}
 buildings.push({x:-800,y:-300,w:330,h:240,name:"Mossers Pizza",color:"#c75b42",emoji:"🍕"},{x:-1250,y:300,w:300,h:230,name:"Awesome Art",color:"#7d63b9",emoji:"🎨"},{x:-1700,y:-350,w:340,h:250,name:"Bobs Bananas",color:"#e4b72e",emoji:"🍌"},{x:900,y:-550,w:380,h:260,name:"Central Market",color:"#5788a8",emoji:"🏪"},{x:1200,y:450,w:350,h:280,name:"City Library",color:"#696e8c",emoji:"📚"},{x:-350,y:-1100,w:400,h:260,name:"Metro Station",color:"#46515c",emoji:"🚇"});
 for(let i=0;i<28;i++)npcs.push({type:"bee",x:rand(-1700,1700),y:rand(-1100,1100),vx:rand(-.5,.5),vy:rand(-.5,.5),size:rand(8,13)});
 for(let i=0;i<16;i++)npcs.push({type:"butterfly",x:rand(-2000,2000),y:rand(-1300,1300),vx:rand(-.7,.7),vy:rand(-.7,.7),size:rand(6,10)});
 for(let i=0;i<18;i++)enemies.push({type:Math.random()<.6?"bird":"ant",x:rand(-2100,2100),y:rand(-1300,1300),vx:rand(-1.2,1.2),vy:rand(-.8,.8),size:Math.random()<.6?24:9,damage:Math.random()<.6?25:12});
}createWorld();
const keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==="e")interactNectar();if(e.key.toLowerCase()==="h")shapeHoney();if(e.key.toLowerCase()==="b")openMenu("hive");if(e.key.toLowerCase()==="m")openMenu("shop")});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function bindHold(id,key){const el=document.getElementById(id),down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointerleave",up);el.addEventListener("pointercancel",up)}
bindHold("up","arrowup");bindHold("down","arrowdown");bindHold("left","arrowleft");bindHold("right","arrowright");
let nectarHeld=false,honeyHeld=false;
document.getElementById("nectarBtn").addEventListener("pointerdown",()=>nectarHeld=true);document.getElementById("nectarBtn").addEventListener("pointerup",()=>nectarHeld=false);document.getElementById("nectarBtn").addEventListener("pointercancel",()=>nectarHeld=false);
document.getElementById("honeyBtn").addEventListener("pointerdown",()=>honeyHeld=true);document.getElementById("honeyBtn").addEventListener("pointerup",()=>honeyHeld=false);document.getElementById("honeyBtn").addEventListener("pointercancel",()=>honeyHeld=false);
function speedValue(){return 2.3+state.speed*.35+state.upgrades.wings*.35}function playerRadius(){return state.rank==="Queen Bee"?22:13}
function updatePlayer(){let dx=0,dy=0;if(keys["arrowleft"]||keys["a"])dx--;if(keys["arrowright"]||keys["d"])dx++;if(keys["arrowup"]||keys["w"])dy--;if(keys["arrowdown"]||keys["s"])dy++;if(dx||dy){const len=Math.hypot(dx,dy);dx/=len;dy/=len;const speed=speedValue();state.x+=dx*speed;state.y+=dy*speed;state.distance+=speed*.01;state.quests.distance+=speed*.01;if(Math.random()<.18)particles.push({x:state.x,y:state.y,vx:-dx*.5+rand(-.3,.3),vy:-dy*.5+rand(-.3,.3),life:20,max:20,color:"#fff0a6",size:rand(2,4)})}state.x=Math.max(-world.width/2+40,Math.min(world.width/2-40,state.x));state.y=Math.max(-world.height/2+40,Math.min(world.height/2-40,state.y));if(nectarHeld)interactNectar();if(honeyHeld)shapeHoney();camera.x+=(state.x-camera.x)*.09;camera.y+=(state.y-camera.y)*.09}
function nearestFlower(){let best=null,bd=999999;for(const f of flowers){if(f.cooldown>0)continue;const d=Math.hypot(f.x-state.x,f.y-state.y);if(d<70&&d<bd){bd=d;best=f}}return best}
function interactNectar(){if(!state.hatched){showMessage("🥚 You are still a larva! Nurse bees are feeding you.");return}const f=nearestFlower();if(!f){showMessage("🌼 Move closer to a flower.");return}const amount=.035*state.gatherSpeed*(1+state.upgrades.gathering*.1);f.nectar-=amount;state.nectar+=amount;state.nectarCollected+=amount;state.quests.nectar+=amount;if(Math.random()<.03){state.flowersPollinated++;state.quests.pollination++;gainXP(4);floating.push({x:f.x,y:f.y,text:"+Pollinated",color:"#ff8bd4",life:50})}if(f.nectar<=0){f.cooldown=500;f.nectar=randInt(2,5)}if(Math.random()<.25)particles.push({x:f.x,y:f.y,vx:rand(-1,1),vy:rand(-1,1),life:35,max:35,color:f.color,size:rand(2,5)})}
function shapeHoney(){if(!state.hatched)return;if(state.nectar<3){showMessage("🌼 You need 3 nectar to make honey.");return}if(Math.hypot(state.x-hive.x,state.y-hive.y)>170){showMessage("🏠 Return to the hive to process your nectar.");return}state.nectar-=3;state.honey+=1;state.honeyMade++;state.quests.honey++;gainXP(8);for(let i=0;i<8;i++)particles.push({x:hive.x+rand(-40,40),y:hive.y+rand(-30,30),vx:rand(-1,1),vy:rand(-1,1),life:50,max:50,color:"#ffd447",size:rand(3,7)});floating.push({x:hive.x,y:hive.y-80,text:"+1 Honey",color:"#ffd447",life:60});if(state.honey%10===0){state.drops++;showMessage("💧 Honey Drop earned!")}if(state.honey>=state.hiveSize*20){state.hiveSize++;state.bees+=2;state.drops+=5;showMessage("🏠 Your hive grew! +2 bees and +5 Honey Drops!");gainXP(100)}save()}
function updateLarva(){if(state.hatched)return;state.age+=.016;state.larvaFood+=.015*state.bees;if(state.larvaFood>=100){state.hatched=true;state.rank="Worker Bee";state.level=1;state.xp=100;state.drops+=10;showMessage("🐝 HATCHED! You are now a Worker Bee!");spawnBurst(hive.x,hive.y,"#ffd447",60);save()}}
function gainXP(amount){state.xp+=amount;const next=ranks.find(r=>r.xp>state.xp);if(next){if(state.xp>=next.xp)state.level++}else state.level=Math.max(state.level,99);updateRank()}
function updateEnemies(){for(const e of enemies){e.x+=e.vx;e.y+=e.vy;if(e.x<-2300||e.x>2300)e.vx*=-1;if(e.y<-1500||e.y>1500)e.vy*=-1;const d=Math.hypot(e.x-state.x,e.y-state.y);if(d<e.size+playerRadius()){const damage=e.damage/(1+state.upgrades.armor*.15);state.health-=damage*.018;floating.push({x:state.x,y:state.y-30,text:"-"+Math.ceil(damage),color:"#ff5d5d",life:30});if(state.health<=0)die()}}}
function updateNPCs(){for(const n of npcs){n.x+=n.vx;n.y+=n.vy;n.vx+=rand(-.025,.025);n.vy+=rand(-.025,.025);n.vx=Math.max(-1,Math.min(1,n.vx));n.vy=Math.max(-1,Math.min(1,n.vy));if(Math.random()<.01){n.vx=rand(-1,1);n.vy=rand(-1,1)}}}
function die(){state.deaths++;showMessage("💀 You died! Your bee life has reset.");spawnBurst(state.x,state.y,"#ff4545",70);state.x=hive.x;state.y=hive.y;state.health=100;state.level=0;state.xp=0;state.rank="Larva";state.hatched=false;state.larvaFood=0;state.nectar=0;state.honey=0;state.upgrades={wings:0,proboscis:0,armor:0,gathering:0,luck:0};updateRank();save()}
function spawnBurst(x,y,color,count){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(1,5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(25,65),max:65,color,size:rand(2,6)})}}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--;if(p.life<=0)particles.splice(i,1)}for(let i=floating.length-1;i>=0;i--){const f=floating[i];f.y-=.7;f.life--;if(f.life<=0)floating.splice(i,1)}}
function worldToScreen(x,y){return{x:x-camera.x+W/2,y:y-camera.y+H/2}}
function drawBackground(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#67c5ff");grad.addColorStop(1,"#d7f2ff");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);const cityY=H*.38;for(let i=-15;i<25;i++){const x=i*180-(camera.x*.12%180),height=80+Math.abs(i*37)%180;ctx.fillStyle="#aebbc7";ctx.fillRect(x,cityY-height,130,height);for(let yy=cityY-height+15;yy<cityY-10;yy+=25)for(let xx=x+15;xx<x+120;xx+=30){ctx.fillStyle="rgba(255,245,150,.65)";ctx.fillRect(xx,yy,9,8)}}ctx.fillStyle="#63b65d";ctx.fillRect(0,H*.38,W,H*.62);ctx.fillStyle="#d8bd8b";const pathY=H*.67;ctx.beginPath();ctx.moveTo(0,pathY-50);ctx.quadraticCurveTo(W/2,pathY+120,W,pathY-50);ctx.lineTo(W,pathY+30);ctx.quadraticCurveTo(W/2,pathY+200,0,pathY+30);ctx.closePath();ctx.fill();for(let i=-12;i<18;i++){const x=i*220-(camera.x*.18%220),y=H*.47+Math.sin(i)*70;ctx.fillStyle="#74452d";ctx.fillRect(x-13,y,26,80);ctx.fillStyle="#3e934c";ctx.beginPath();ctx.arc(x,y,62,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-45,y+20,42,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+40,y+15,45,0,Math.PI*2);ctx.fill()}}
function drawBuildings(){for(const b of buildings){const s=worldToScreen(b.x,b.y);ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(8,8,b.w,b.h);ctx.fillStyle=b.color;ctx.fillRect(0,0,b.w,b.h);for(let x=20;x<b.w-20;x+=45)for(let y=30;y<b.h-20;y+=48){ctx.fillStyle="rgba(255,240,170,.75)";ctx.fillRect(x,y,22,28)}ctx.fillStyle="rgba(0,0,0,.2)";ctx.fillRect(0,-44,b.w,44);ctx.textAlign="center";ctx.font="bold 20px Arial";ctx.fillStyle="white";ctx.fillText(b.emoji+" "+b.name,b.w/2,-14);ctx.restore()}}
function drawFlowers(){for(const f of flowers){if(f.cooldown>0)f.cooldown--;const s=worldToScreen(f.x,f.y);if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)continue;ctx.save();ctx.translate(s.x,s.y);ctx.strokeStyle="#338e42";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16);ctx.stroke();if(f.cooldown<=0){for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(Math.cos(a)*7,Math.sin(a)*7,6,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#ffd83d";ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function drawBeeLocal(x,y,size){ctx.save();ctx.translate(x,y);ctx.fillStyle="rgba(255,255,255,.6)";ctx.beginPath();ctx.ellipse(-size*.6,-size*.7,size*.8,size*.45,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(size*.6,-size*.7,size*.8,size*.45,.4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd447";ctx.beginPath();ctx.ellipse(0,0,size,size*.75,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#2c2419";ctx.lineWidth=Math.max(2,size*.22);for(let i=-.35;i<=.35;i+=.35){ctx.beginPath();ctx.moveTo(i*size,-size*.65);ctx.lineTo(i*size,size*.65);ctx.stroke()}ctx.fillStyle="#222";ctx.beginPath();ctx.arc(size*.45,-size*.15,size*.14,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawHive(){const s=worldToScreen(hive.x,hive.y);ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle="#68432c";ctx.beginPath();ctx.moveTo(-65,150);ctx.lineTo(-25,-30);ctx.lineTo(25,-30);ctx.lineTo(65,150);ctx.closePath();ctx.fill();ctx.lineWidth=18;ctx.strokeStyle="#68432c";ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-130,-90);ctx.moveTo(10,5);ctx.lineTo(125,-100);ctx.stroke();const size=110+state.hiveSize*15,colors=["#e5a13b","#d97745","#bc65b9","#65a9d6","#74c88a"];ctx.fillStyle=colors[state.hiveColor%colors.length];ctx.beginPath();ctx.ellipse(0,20,size*.55,size*.7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(80,45,20,.4)";ctx.lineWidth=8;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(0,20+i*25,size*.48,-Math.PI*.85,-Math.PI*.15);ctx.stroke()}ctx.fillStyle="#4a281a";ctx.beginPath();ctx.ellipse(0,75,27,38,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e0a02f";ctx.fillRect(-75,90,150,62);ctx.fillStyle="#8c5525";ctx.fillRect(-55,80,110,20);ctx.fillStyle="#ffd447";ctx.beginPath();ctx.arc(0,115,22,0,Math.PI*2);ctx.fill();ctx.font="20px Arial";ctx.textAlign="center";ctx.fillStyle="white";ctx.fillText("🍯",0,122);for(let i=0;i<Math.min(12,state.bees);i++){const a=i*.8,bx=Math.cos(a)*size*.7,by=40+Math.sin(a)*size*.35;drawBeeLocal(bx,by,7)}ctx.restore()}
function drawPlayer(){const s=worldToScreen(state.x,state.y);ctx.save();ctx.translate(s.x,s.y);const size=playerRadius();ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(0,size+7,size*1.2,5,0,0,Math.PI*2);ctx.fill();if(!state.hatched){ctx.fillStyle="#f1b29f";ctx.beginPath();ctx.ellipse(0,0,23,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f7d1c6";for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*7,-3,4,0,Math.PI*2);ctx.fill()}ctx.font="12px Arial";ctx.textAlign="center";ctx.fillStyle="white";ctx.fillText(Math.floor(state.larvaFood)+"%",0,-28);ctx.restore();return}ctx.fillStyle="rgba(255,255,255,.67)";ctx.beginPath();ctx.ellipse(-size*.85,-size*.75,size*.95,size*.58,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(size*.85,-size*.75,size*.95,size*.58,.4,0,Math.PI*2);ctx.fill();const ri=ranks.findIndex(r=>r.name===state.rank);ctx.fillStyle=ri>=5?"#fff0a0":"#ffd447";ctx.beginPath();ctx.ellipse(0,0,size,size*.75,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#33291c";ctx.lineWidth=4;for(let i=-.45;i<=.45;i+=.45){ctx.beginPath();ctx.moveTo(i*size,-size*.65);ctx.lineTo(i*size,size*.65);ctx.stroke()}ctx.fillStyle="#181818";ctx.beginPath();ctx.arc(size*.5,-size*.25,size*.15,0,Math.PI*2);ctx.fill();if(state.rank==="Queen Bee"||state.rank==="Royal Bee"){ctx.fillStyle="#ffd447";ctx.beginPath();ctx.moveTo(-13,-size-4);ctx.lineTo(-7,-size-18);ctx.lineTo(0,-size-6);ctx.lineTo(7,-size-18);ctx.lineTo(13,-size-4);ctx.closePath();ctx.fill()}ctx.restore()}
function drawNPCs(){for(const n of npcs){const s=worldToScreen(n.x,n.y);if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)continue;if(n.type==="bee"){ctx.save();ctx.translate(s.x,s.y);drawBeeLocal(0,0,n.size);ctx.restore()}else{ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle="#70d4ff";ctx.beginPath();ctx.ellipse(0,0,n.size,n.size*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ff8ad8";ctx.beginPath();ctx.arc(-n.size*.6,-n.size*.2,n.size*.55,0,Math.PI*2);ctx.arc(n.size*.6,-n.size*.2,n.size*.55,0,Math.PI*2);ctx.fill();ctx.restore()}}}
function drawEnemies(){for(const e of enemies){const s=worldToScreen(e.x,e.y);if(s.x<-60||s.x>W+60||s.y<-60||s.y>H+60)continue;ctx.save();ctx.translate(s.x,s.y);if(e.type==="bird"){ctx.fillStyle="#3c4652";ctx.beginPath();ctx.ellipse(0,0,e.size,e.size*.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#252d35";ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-e.size*1.5,-12);ctx.lineTo(-e.size*.6,6);ctx.fill();ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(e.size*1.5,-12);ctx.lineTo(e.size*.6,6);ctx.fill();ctx.fillStyle="#ffbd3d";ctx.beginPath();ctx.moveTo(e.size,0);ctx.lineTo(e.size+13,5);ctx.lineTo(e.size,9);ctx.fill()}else{ctx.fillStyle="#40251c";for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*5,0,7,0,Math.PI*2);ctx.fill()}}ctx.restore()}}
function drawParticles(){for(const p of particles){const s=worldToScreen(p.x,p.y);ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(s.x,s.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floating){const s=worldToScreen(f.x,f.y);ctx.globalAlpha=Math.min(1,f.life/20);ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillStyle=f.color;ctx.fillText(f.text,s.x,s.y)}ctx.globalAlpha=1}
function drawMinimap(){const mw=145,mh=90,x=W-mw-15,y=H-mh-105;ctx.fillStyle="rgba(10,15,20,.68)";ctx.fillRect(x,y,mw,mh);ctx.strokeStyle="rgba(255,255,255,.2)";ctx.strokeRect(x,y,mw,mh);ctx.fillStyle="#ffd447";ctx.fillRect(x+mw/2-3,y+mh/2-3,6,6);for(const b of buildings){ctx.fillStyle="#a889d4";ctx.fillRect(x+(b.x/world.width+.5)*mw,y+(b.y/world.height+.5)*mh,4,4)}ctx.fillStyle="#ff5757";for(const e of enemies)ctx.fillRect(x+(e.x/world.width+.5)*mw,y+(e.y/world.height+.5)*mh,2,2);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+(state.x/world.width+.5)*mw,y+(state.y/world.height+.5)*mh,3,0,Math.PI*2);ctx.fill()}
function updateUI(){document.getElementById("honey").textContent=Math.floor(state.honey);document.getElementById("nectar").textContent=Math.floor(state.nectar);document.getElementById("drops").textContent=Math.floor(state.drops);document.getElementById("bees").textContent=state.bees;updateRank()}
function showMessage(text){const el=document.getElementById("message");el.textContent=text;el.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>el.style.opacity=0,2200)}
function openMenu(type){const menu=document.getElementById("menu"),content=document.getElementById("menuContent");menu.style.display="flex";if(type==="shop")content.innerHTML=shopHTML();if(type==="hive")content.innerHTML=hiveHTML();if(type==="stats")content.innerHTML=statsHTML();if(type==="help")content.innerHTML=helpHTML()}
function closeMenu(){document.getElementById("menu").style.display="none"}
function shopHTML(){const upgrades=[["wings","🪽 Stronger Wings","Fly faster.","15"],["gathering","🌼 Better Gathering","Collect nectar faster.","20"],["proboscis","👅 Longer Proboscis","Increase nectar capacity.","25"],["armor","🛡️ Tough Exoskeleton","Take less damage.","30"],["luck","🍀 Flower Luck","Better chances of rare rewards.","40"]];return `<h1>🛒 Honey Drop Shop</h1><p>You have <b>💧 ${Math.floor(state.drops)}</b> Honey Drops.</p><div class="grid">${upgrades.map(u=>{const cost=Math.floor(Number(u[3])*Math.pow(1.7,state.upgrades[u[0]]));return `<div class="card"><h3>${u[1]}</h3><p>${u[2]}</p><p>Level: ${state.upgrades[u[0]]}</p><button onclick="buyUpgrade('${u[0]}',${cost})">Buy — 💧 ${cost}</button></div>`}).join("")}</div><hr><div class="card"><h3>💧 How to earn Honey Drops</h3><p>Pollinate flowers, make honey, expand the hive, complete achievements, and discover new areas.</p></div>`}
function buyUpgrade(id,cost){if(state.drops<cost){showMessage("💧 Not enough Honey Drops!");return}state.drops-=cost;state.upgrades[id]++;showMessage("✨ Upgrade purchased!");save();openMenu("shop")}
function hiveHTML(){const nextSize=state.hiveSize*20;return `<h1>🏠 Your Hive</h1><div class="card"><h2>Hive Level ${state.hiveSize}</h2><p>Your hive currently contains <b>${state.bees} bees</b>.</p><p>Honey needed for next expansion: <b>${Math.floor(state.honey)}/${nextSize}</b></p><div class="progress"><i style="width:${Math.min(100,state.honey/nextSize*100)}%"></i></div></div><div class="card"><h2>👑 Queen Controls</h2>${state.rank==="Queen Bee"?`<p>You have reached the highest rank.</p><button onclick="changeHiveColor()">🎨 Change Hive Color</button><button onclick="changeHivePattern()">🌀 Change Hive Pattern</button><button onclick="addHiveRoom()">➕ Design New Hive Room</button>`:`<p>Reach <b>Queen Bee</b> to gain complete control over the appearance and layout of the hive.</p>`}</div><div class="card"><h2>🐝 Hive Activity</h2><p>Builder Bees: ${Math.floor(state.bees*.2)}</p><p>Nurse Bees: ${Math.floor(state.bees*.2)}</p><p>Forager Bees: ${Math.floor(state.bees*.4)}</p><p>Guard Bees: ${Math.floor(state.bees*.2)}</p></div>`}
function changeHiveColor(){state.hiveColor++;save();showMessage("🎨 Hive appearance changed!");openMenu("hive")}function changeHivePattern(){state.hivePattern++;save();showMessage("🌀 Hive pattern changed!");openMenu("hive")}function addHiveRoom(){state.hiveSize++;state.bees+=3;state.drops+=10;save();showMessage("🏠 New royal hive room created!");openMenu("hive")}
const achievements=[["First Flight","Fly outside the hive.",()=>state.distance>20],["First Nectar","Collect nectar.",()=>state.nectarCollected>=1],["Busy Bee","Collect 100 nectar.",()=>state.nectarCollected>=100],["Pollinator","Pollinate 25 flowers.",()=>state.flowersPollinated>=25],["Honey Maker","Make 25 honey.",()=>state.honeyMade>=25],["Hive Builder","Reach hive level 5.",()=>state.hiveSize>=5],["Explorer","Travel 1,000 meters.",()=>state.distance>=1000],["Veteran","Reach Honey Bee.",()=>state.rank==="Honey Bee"],["Guardian","Reach Soldier Bee.",()=>state.rank==="Soldier Bee"],["Royalty","Reach Royal Bee.",()=>state.rank==="Royal Bee"],["The Queen","Become Queen Bee.",()=>state.rank==="Queen Bee"]];
function statsHTML(){return `<h1>📊 Bee Statistics</h1><div class="grid"><div class="card"><h3>🐝 Rank</h3><p>${state.rank}</p></div><div class="card"><h3>⭐ XP</h3><p>${Math.floor(state.xp)}</p></div><div class="card"><h3>🌼 Nectar</h3><p>${Math.floor(state.nectarCollected)}</p></div><div class="card"><h3>🌸 Pollinated</h3><p>${Math.floor(state.flowersPollinated)}</p></div><div class="card"><h3>🍯 Honey Made</h3><p>${Math.floor(state.honeyMade)}</p></div><div class="card"><h3>🗺️ Distance</h3><p>${Math.floor(state.distance)}m</p></div><div class="card"><h3>💀 Deaths</h3><p>${state.deaths}</p></div><div class="card"><h3>🏠 Hive Size</h3><p>${state.hiveSize}</p></div></div><h2>🏆 Achievements</h2><div class="grid">${achievements.map(a=>{const unlocked=state.achievements.includes(a[0]);return `<div class="card"><h3>${unlocked?"🏆":"🔒"} ${a[0]}</h3><p>${unlocked?"Unlocked!":"Keep playing to unlock this."}</p></div>`}).join("")}</div>`}
function helpHTML(){return `<h1>❔ How To Play</h1><div class="card"><h2>🥚 Start as a Larva</h2><p>Nurse bees feed you automatically while you wait inside the hive. At 100% food, you hatch.</p></div><div class="card"><h2>🌼 Collect Nectar</h2><p>Fly near flowers and hold the Nectar button.</p></div><div class="card"><h2>🍯 Make Honey</h2><p>Return to the hive and hold Shape to turn nectar into honey.</p></div><div class="card"><h2>🏠 Grow The Hive</h2><p>When the hive stores enough honey, builder bees expand it and more bees arrive.</p></div><div class="card"><h2>⚠️ Danger</h2><p>Birds and ants can attack you. If health reaches zero, your current bee life resets while the hive remains.</p></div><div class="card"><h2>👑 Become Queen</h2><p>Reach Queen Bee to customize your hive.</p></div><div class="card"><h2>⌨️ Controls</h2><p>WASD / Arrow Keys — Move<br>E — Collect nectar<br>H — Shape honey<br>M — Shop<br>B — Hive</p></div><button onclick="resetGame()" style="background:#ff6464;color:white;border:0;border-radius:10px;padding:12px;width:100%;font-weight:bold">Reset Entire Save</button>`}
function resetGame(){if(!confirm("Delete your entire hive and start over?"))return;localStorage.removeItem(SAVE_KEY);location.reload()}
function checkAchievements(){for(const a of achievements)if(!state.achievements.includes(a[0])&&a[2]()){state.achievements.push(a[0]);state.drops+=5;showMessage("🏆 Achievement: "+a[0]);spawnBurst(state.x,state.y,"#ffd447",25)}}
let gameTime=0;function drawDayNight(){gameTime+=.00035;const darkness=(Math.sin(gameTime)+1)/2*.48;ctx.fillStyle=`rgba(10,20,50,${darkness})`;ctx.fillRect(0,0,W,H);const sunX=W*(.5+Math.cos(gameTime)*.42),sunY=H*(.35+Math.sin(gameTime)*.2);ctx.fillStyle="#fff3a1";ctx.beginPath();ctx.arc(sunX,sunY,35,0,Math.PI*2);ctx.fill()}
let last=performance.now();function loop(now){last=now;updatePlayer();updateLarva();updateEnemies();updateNPCs();updateParticles();checkAchievements();drawBackground();drawBuildings();drawFlowers();drawHive();drawNPCs();drawEnemies();drawParticles();drawPlayer();drawDayNight();drawMinimap();updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
setInterval(save,5000);setTimeout(()=>showMessage(!state.hatched?"🥚 You were born! Nurse bees are feeding you...":"🐝 Welcome back to your hive!"),700);updateRank();updateUI();
</script>
</body>
</html>
